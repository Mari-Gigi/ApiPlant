openapi: 3.0.1
info:
  title: Sample API
  description: API description in Markdown.
  version: 1.0.0

tags:
  - name: plantas
    description: Operaciones con plantas
  - name: cuidados
    description: Operaciones con cuidados
  - name: categorias
    description: Operaciones con categorias
  - name: plagas
    description: Operaciones con plagas
  - name: consjeos
    description: Operaciones con consejos

servers:
  - url: 'https://apiplant.com'

paths: #parametros de tipo Path porque se pasan en la URL. Son obligatorios
  /plantas: #parametro para el get             ###################################################################################################
    get:
      tags:
        - plantas
      summary: Obtención de un listado de plantas
      description: Devuelve una lista completa de todas las plantas registradas en la Api. 
                  Admite filtros opcionales (género, especie o toxicidad).
      parameters: # son Query porque hay que pasarlos en la URL para aplicar los filtros. Son opcionales
        - name: genero
          in: query
          description: filtro por género de planta.
          required: false
          schema:
            type: string
        - name: especie
          in: query
          description: filtro por especie de planta.
          required: false
          schema:
            type: string
        - name: esToxica
          in: query
          description: filtro por toxicidad de la planta
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantaOutDto'
        '400': #PONIENDO UN XXX EN EL VALOR DEL BOOLEANO
          description:  El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404': #PONIENDO UN XXX EN EL VALOR PATH DE LA URL
          description: Planta no encontrada con esos parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500': #PONIENDO UN XXX EN EL NOMBRE DEL QUERY
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    post:
      tags:
        - plantas
      summary: Crear una planta nueva.
      description: Añadir una planta nueva con parámetro obligatorios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantaInDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantaOutDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /plantas/{plantaId}:            ###################################################################################################
    get:
      tags:
        - plantas
      summary: Obtención de una planta concreta por su Id
      description: Devuelve una planta concreta buscándola a través de su Id.
      parameters:
        - name: plantaId
          in: path
          description: identificador de la planta
          required: true
          schema:
            type: number
            format: int64
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantaOutDto'
        '400': #NO PONIENDO UN VALOR DE PLANTAID ERRONEO
          description: El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404': #PONIENDO UN PARAMETRO PLANTAID QUE NO EXISTA
          description: Planta no encontrada con esos parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500': #PONIENDO UN XXX EN EL NOMBRE DEL PARAMETRO PLANTAID
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    put:
      tags:
        - plantas
      summary: Modificación de una planta existente.
      description: Modificación y nuevo registro de una planta a través de su Id.
      parameters:
        - name: plantaId
          in: path
          description: identificador de la planta
          required: true
          schema:
            type: number
            format: int64
      requestBody:
        description: Nuevos detalles de la planta
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantaInDto'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantaOutDto'
        '400': #NO PONIENDO UN VALOR DE PLANTAID ERRONEO
          description: El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404': #PONIENDO UN PARAMETRO PLANTAID QUE NO EXISTA
          description: Planta no encontrada con esos parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500': #PONIENDO UN XXX EN EL NOMBRE DEL PARAMETRO PLANTAID
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    delete:
      tags:
        - plantas
      summary: Eliminar planta por ID
      description: Eliminación de una planta a través de su Id y actualización del listado completo de plantas.
      parameters:
        - name: plantaId
          in: path
          description: identificador de la planta
          required: true
          schema:
            type: number
            format: int64
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantaOutDto'
        '400': #NO PONIENDO UN VALOR DE PLANTAID ERRONEO
          description: El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404': #PONIENDO UN PARAMETRO PLANTAID QUE NO EXISTA
          description: Planta no encontrada con esos parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500': #PONIENDO UN XXX EN EL NOMBRE DEL PARAMETRO PLANTAID
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /cuidados:            ###################################################################################################
    get:
      tags:
        - cuidados
      summary: Obtención de un listado de cuidados
      description: Devuelve una lista de todos los cuidados registrados en la API. Se pueden aplicar filtros opcionales.
      parameters:
        - name: riego
          in: query
          description: Filtro por tipo o frecuencia de riego
          required: false
          schema:
            type: string
        - name: sustrato
          in: query
          description: Filtro por tipo de sustrato
          required: false
          schema:
            type: string
        - name: esInterior
          in: query
          description: Filtro para indicar si el cuidado es de interior
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CuidadoOutDto'
        '400':
          description: El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Cuidado no encontrado con esos parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    post:
      tags:
        - cuidados
      summary: Crear un nuevo cuidado
      description: Registra un nuevo cuidado para plantas en la base de datos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CuidadoInDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuidadoOutDto'
        '400':
          description: El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'


  /cuidados/{cuidadoId}:            ###################################################################################################
    get:
      tags:
        - cuidados
      summary: Obtener un cuidado específico por ID
      description: Devuelve la información detallada del cuidado indicado por su identificador único.
      parameters:
        - name: cuidadoId
          in: path
          required: true
          description: ID del cuidado a consultar
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuidadoOutDto'
        '400':
          description: El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '404':
          description: Cuidado no encontrado con esos parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    put:
      tags:
        - cuidados
      summary: Modificar un cuidado existente
      description: Actualiza los datos de un cuidado identificado por su ID.
      parameters:
        - name: cuidadoId
          in: path
          required: true
          description: ID del cuidado a modificar
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CuidadoInDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuidadoOutDto'
        '400':
          description: El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Cuidado no encontrado con esos parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: Cuidado asociado a una planta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    delete:
      tags:
        - cuidados
      summary: Eliminar un cuidado
      description: Elimina un cuidado por su ID, siempre que no esté asociado a plantas.
      parameters:
        - name: cuidadoId
          in: path
          required: true
          description: ID del cuidado a eliminar
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
        '400':
          description: El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Cuidado no encontrado con esos parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: Cuidado asociado a una planta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

