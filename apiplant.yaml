          example: El género es obligatorio

    BadRequest: ################################################################
      type: object
      properties:
        code:
          type: string
          description: Código HTTP del error
          example: 400
        message:
          type: string
          description: Descripción general del error
          example: Solicitud incorrecta
        errorMessages:
          type: array
          description: Lista de errores de validación en campos concretos
          items:
            $ref: '#/components/schemas/ErrorMessage'

    NotFound: ##########################################################
      type: object
      properties:
        code:
          type: string
          description: Código HTTP del error
          example: 404
        message:
          type: string
          description: Recurso no encontrado o inexistente
          example: Planta con ID 99 no encontrada

    Conflict: #######################################################
      type: object
      properties:
        code:
          type: string
