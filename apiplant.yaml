          type: boolean
          description: Indicador de si la planta es tóxica para personas o animales
          example: true
        alturaMaxima:
          type: number
          format: float
          description: Altura máxima aproximada que puede alcanzar la planta (en metros)
          example: 1.5
        tipoCrecimiento:
          type: string
          description: Tipo de crecimiento que presenta la planta (ej. arbusto, trepadora)
          example: Trepadora
        cuidadoId:
          type: integer
          format: int64
          description: ID del cuidado asociado a esta planta
          example: 2
        categoriaId:
          type: integer
          format: int64
          description: ID de la categoría botánica asociada a esta planta
          example: 1
        plagaIds:
          type: array
          description: Lista de IDs de plagas que afectan a la planta
          items:
            type: integer
            format: int64
          example: [ 1, 3 ]
        consejoIds:
          type: array
          description: Lista de IDs de consejos útiles para el cuidado de esta planta
          items:
            type: integer
            format: int64
          example: [ 5, 7 ]

