                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    put:
      tags:
        - consejos
      summary: Modificar consejo por ID
      parameters:
        - name: consejoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsejoInDto'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsejoOutDto'
        '404':
          description: Consejo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: Consejo asociado a una planta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '400':
          description: El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    delete:
      tags:
        - consejos
      summary: Eliminar consejo por ID
      parameters:
        - name: consejoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
        '404':
          description: Consejo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: Consejo asociado a una planta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '400':
          description: El parámetro tiene un valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

#COMPONENTES
components:
  schemas:
    PlantaOutDto: #########################################################
      type: object
      properties:
        id_planta:
          type: number
          format: int64
          description: Identificador de la planta
          example: 1
        genero:
          type: string
          description: Género de la planta
          example: Monstera
        especie:
          type: string
          description: Especie de la planta
          example: Adansonii
        esToxica:
          type: boolean
          description: Indicador de si la planta es tóxica para personas o animales
          example: true
        alturaMaxima:
          type: number
          format: float
          description: Altura máxima aproximada que puede alcanzar la planta (en metros)
          example: 1.5
        tipoCrecimiento:
          type: string
          description: Tipo de crecimiento que presenta la planta (ej. arbusto, trepadora)
          example: Trepadora
        cuidadoId:
          type: integer #numeros sin decimales
          format: int64
          description: Identificador del cuidado asignado a la planta
          example: 1
        categoriaId:
          type: integer
          format: int64
          description: Identificador de la categoría asignada a la planta
          example: 1
        plagaId:
          type: array
          format: int64
          description: Lista de IDs de plagas que pueden afectar a la planta
          example: [1,2]
        consejoId:
          type: array
          format: int64
          description: Lista de IDs de consjeosque asociados a la planta
          example: [1,2]

    PlantaInDto: ###################################################
      type: object
